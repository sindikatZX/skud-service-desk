services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fsm
      POSTGRES_USER: fsm
      # Пустой или незаданный пароль останавливает запуск: молчаливый дефолт
      # означал бы БД со всем известным паролем.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsm -d fsm"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fsm:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@db:5432/fsm
      AUTH_SECRET: ${AUTH_SECRET:?задайте AUTH_SECRET в .env (openssl rand -hex 32)}
      SEED_PASSWORD: ${SEED_PASSWORD:-password}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      PORT: 3000
    volumes:
      - uploads:/data/uploads
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Опционально: резервное копирование БД раз в сутки в ./backups
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on: [db]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c", "while true; do pg_dump -h db -U fsm fsm | gzip > /backups/fsm-$(date +%F).sql.gz; sleep 86400; done"]

volumes:
  pgdata:
  uploads:
